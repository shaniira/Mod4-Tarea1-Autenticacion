name: andina-arquitecturas

services:
  onion-mongodb:
    image: mongo:8
    container_name: andina-onion-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: andina_seguros_onion
    ports: ["27018:27017"]
    volumes: ["onion_mongo_data:/data/db"]
    networks: ["onion_network"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 15

  onion-backend:
    image: andina-seguros-onion:1.0.0
    container_name: andina-onion-backend
    build: { context: ./Arquitectura-Onion, dockerfile: Dockerfile }
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_DATA_MONGODB_URI: mongodb://onion-mongodb:27017/andina_seguros_onion
      JWT_SECRET: cambia-esta-clave-en-produccion-debe-superar-32-caracteres
      JWT_EXPIRATION_SECONDS: 28800
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports: ["8081:8080"]
    networks: ["onion_network"]
    depends_on:
      onion-mongodb: { condition: service_healthy }

  hexagonal-mongodb:
    image: mongo:8
    container_name: andina-hexagonal-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: andina_seguros_hexagonal
    ports: ["27019:27017"]
    volumes: ["hexagonal_mongo_data:/data/db"]
    networks: ["hexagonal_network"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 15

  hexagonal-backend:
    image: andina-seguros-hexagonal:1.0.0
    container_name: andina-hexagonal-backend
    build: { context: ./Arquitectura-Hexagonal, dockerfile: Dockerfile }
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_DATA_MONGODB_URI: mongodb://hexagonal-mongodb:27017/andina_seguros_hexagonal
      JWT_SECRET: cambia-esta-clave-en-produccion-debe-superar-32-caracteres
      JWT_EXPIRATION_SECONDS: 28800
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports: ["8082:8080"]
    networks: ["hexagonal_network"]
    depends_on:
      hexagonal-mongodb: { condition: service_healthy }

  clean-mongodb:
    image: mongo:8
    container_name: andina-clean-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: andina_seguros_clean
    ports: ["27020:27017"]
    volumes: ["clean_mongo_data:/data/db"]
    networks: ["clean_network"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 15

  clean-backend:
    image: andina-seguros-clean:1.0.0
    container_name: andina-clean-backend
    build: { context: ./Arquitectura-Clean, dockerfile: Dockerfile }
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_DATA_MONGODB_URI: mongodb://clean-mongodb:27017/andina_seguros_clean
      JWT_SECRET: cambia-esta-clave-en-produccion-debe-superar-32-caracteres
      JWT_EXPIRATION_SECONDS: 28800
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET}
      FACEBOOK_REDIRECT_URI: ${FACEBOOK_REDIRECT_URI}
      FACEBOOK_OAUTH_STATE_TTL_SECONDS: 3600
      FACEBOOK_FRONTEND_CALLBACK_URL: http://localhost:5173/login
    ports: ["8083:8080"]
    networks: ["clean_network"]
    depends_on:
      clean-mongodb: { condition: service_healthy }

volumes:
  onion_mongo_data: { name: andina_onion_mongo_data }
  hexagonal_mongo_data: { name: andina_hexagonal_mongo_data }
  clean_mongo_data: { name: andina_clean_mongo_data }

networks:
  onion_network: { name: andina_onion_network }
  hexagonal_network: { name: andina_hexagonal_network }
  clean_network: { name: andina_clean_network }