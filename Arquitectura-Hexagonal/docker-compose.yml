name: andina-hexagonal

services:
  mongodb:
    image: mongo:8
    container_name: andina-hexagonal-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: andina_seguros_hexagonal
    ports:
      - "27019:27017"
    volumes:
      - hexagonal_mongo_data:/data/db
    networks:
      - hexagonal_network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    image: andina-seguros-hexagonal:1.0.0
    container_name: andina-hexagonal-backend
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/andina_seguros_hexagonal
      JWT_SECRET: cambia-esta-clave-en-produccion-debe-superar-32-caracteres
      JWT_EXPIRATION_SECONDS: 28800
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8082:8080"
    networks:
      - hexagonal_network
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  hexagonal_mongo_data:
    name: andina_hexagonal_mongo_data

networks:
  hexagonal_network:
    name: andina_hexagonal_network